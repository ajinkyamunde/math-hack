# Local full-stack run: docker compose up --build   ->  http://localhost:8080
# Uses a single-node MongoDB replica set so transactions-capable features behave as on Atlas.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/mathhack?replicaSet=rs0
      FRONTEND_URL: http://localhost:8080
      BACKEND_PUBLIC_URL: http://localhost:8080
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (32+ random characters) in your shell or .env}
      COOKIE_SAME_SITE: lax
      TRUST_PROXY: 1

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
